<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Cyber Spiky Glow Effects -->
    <filter id="spikyGlowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="spikyGlowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Cyber Gradient Visor -->
    <linearGradient id="spikyVisorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>

    <!-- CSS Keyframe Animation: Smooth Anime Eye Blink -->
    <style>
      @keyframes capriBlink {
        0%, 90%, 100% {
          transform: scaleY(1);
        }
        95% {
          transform: scaleY(0.05);
        }
      }
      .capri-eye-group {
        transform-origin: 100px 75px;
        animation: capriBlink 4s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Super Sharp Angular Electric Hair (Studio Trigger Spikes) -->
  <g id="capri-hair" filter="url(#spikyGlowPink)">
    <!-- Outer Ultra-Sharp Spikes Silhouette -->
    <polygon points="100,0 128,24 168,2 152,44 198,28 168,70 198,92 158,110 188,142 142,126 150,172 116,138 110,198 88,198 82,138 48,172 56,126 10,142 40,110 0,92 30,70 0,28 46,44 30,2 70,24" fill="#ff0055" />
    <!-- Inner Sharp Layers -->
    <polygon points="100,10 122,30 156,12 142,46 182,34 154,70 182,88 146,104 172,130 134,118 140,156 110,130 90,166 70,130 58,156 64,118 26,130 52,104 16,88 44,70 16,34 56,46 42,12 76,30" fill="#e0004d" />
  </g>

  <!-- Small Chibi Outfit & Shoulders -->
  <g id="capri-outfit">
    <!-- Tiny Cyber Suit Collar -->
    <polygon points="75,130 100,115 125,130 142,190 58,190" fill="#080c0f" />
    <!-- Neon Core Strip -->
    <polygon points="100,118 112,145 100,185 88,145" fill="url(#spikyVisorGrad)" filter="url(#spikyGlowGreen)" />
    <!-- Cute Pink Accent Dots -->
    <circle cx="75" cy="140" r="4.5" fill="#ff0055" />
    <circle cx="125" cy="140" r="4.5" fill="#ff0055" />
  </g>

  <!-- Face Base & Mask Framing (Accurate Trigger Anime Geometry) -->
  <g id="capri-head">
    <!-- Sharp Polygon Mask Base -->
    <polygon points="100,34 146,54 136,106 100,128 64,106 54,54" fill="#090d10" stroke="#00ff9d" stroke-width="2" />

    <!-- Animated Eye Group (Blinks Automatically) -->
    <g class="capri-eye-group">
      <!-- Sharp Emerald Eye Frames (Trigger-style Outer Angles) -->
      <polygon points="62,64 96,60 92,90 64,86" fill="#00ff9d" filter="url(#spikyGlowGreen)" />
      <polygon points="138,64 104,60 108,90 136,86" fill="#00ff9d" filter="url(#spikyGlowGreen)" />

      <!-- Left Pupil: Layered Optical Cyber Eye -->
      <circle cx="78" cy="75" r="9" fill="#00b4d8" />
      <circle cx="78" cy="75" r="6" fill="#00f0ff" />
      <circle cx="78" cy="75" r="3" fill="#ffffff" />

      <!-- Right Pupil: Layered Optical Cyber Eye -->
      <circle cx="122" cy="75" r="9" fill="#00b4d8" />
      <circle cx="122" cy="75" r="6" fill="#00f0ff" />
      <circle cx="122" cy="75" r="3" fill="#ffffff" />
    </g>

    <!-- Cute Blush Marks -->
    <ellipse cx="68" cy="92" rx="5" ry="2.5" fill="#ff0055" opacity="0.8" />
    <ellipse cx="132" cy="92" rx="5" ry="2.5" fill="#ff0055" opacity="0.8" />

    <!-- Anime Jagged Cyber Mouth -->
    <path d="M 88,102 Q 94,108 100,103 Q 106,108 112,102" fill="none" stroke="#00ff9d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#spikyGlowGreen)" />
  </g>

  <!-- Sharp Cyber Spark Accents -->
  <g id="capri-sharp-sparks">
    <polygon points="26,46 30,50 26,54 22,50" fill="#00b4d8" />
    <polygon points="174,46 178,50 174,54 170,50" fill="#00ff9d" />
    <polygon points="160,126 166,128 158,138 164,136 154,146 156,134 150,136" fill="#ff0055" filter="url(#spikyGlowPink)" />
  </g>
</svg>